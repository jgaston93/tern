# Built-in tern profiles. This file is compiled into the binary.
#
# To add or override profiles, put [[profile]] entries in any of:
#   $TERN_CONFIG, ./tern.toml, ~/.config/tern/profiles.toml
# User profiles are checked before these, so a user profile with the same
# name or `match` wins.
#
# Selection: --profile NAME (or TERN_PROFILE), otherwise the first profile
# whose `match` substrings appear in the model name, otherwise "default".
#
# Sampling values below are starting points taken from model cards at the
# time of writing. Check the card for the exact model you run.
#
# Fields (all optional):
#   match           substrings of the model name that select this profile
#   ctx             context budget in tokens (set to what the server is configured for)
#   max_tokens      max output tokens per response
#   temperature, top_p, top_k, min_p, repeat_penalty   sampling; unset = server default
#   edit_format     "exact" | "fuzzy" | "whole"
#   tools           subset of: read edit write grep glob bash (empty = all)
#   prompt          "terse" (short tool descriptions) | "guided" (adds examples)
#   prompt_extra    text appended to the system prompt
#   lenient_parsing recover tool calls written as text, repair sloppy JSON
#   keep_reasoning  keep reasoning text within the current request
#   check           command run after edits, e.g. "cargo check --message-format short"
#   bash_timeout    kill bash/check after N seconds (default 120; 0 = no limit)
#   require_check_pass  don't let the model finish while `check` fails; re-prompt
#                   instead (only if it edited something, up to a few retries)
#   subagents       profile names this agent may delegate to via the `task` tool
#                   (empty = ordinary single agent; the child's intermediate tokens
#                   never enter this agent's context, only its final summary does)
#   tool_choice     constrain tool calling at the server; sent verbatim when set.
#                   "auto" is safe; "required" forces a call every turn and breaks
#                   the text-only finish, so avoid it.
#   grammar         llama.cpp GBNF string, sent verbatim (forces valid output)
#   response_format structured-output object (vLLM guided / OpenAI), e.g.
#                   [profile.response_format] \n type = "json_object"
#                   Constraining output means fewer tool calls arrive as text, so
#                   with a reliable server you can set lenient_parsing = false.
#   lsp             language-server commands by file extension, enabling the
#                   def/refs tools, e.g. lsp = { rs = "rust-analyzer" }. They
#                   resolve a symbol to path:line: source via the server (precise
#                   where grep is ambiguous); a missing server falls back to grep.
#   parallel_subagents  run several task delegations from one step at once. Only
#                   helps on a backend that decodes in parallel (vLLM, llama.cpp
#                   --parallel); give subagents non-overlapping work (shared tree).
#   max_parallel    cap on concurrent subagents: a step with more task calls runs
#                   them in batches of this size (0 = no clamp). Needs parallel_subagents.

[[profile]]
name = "default"
temperature = 0.2

# Hosted frontier models: exact edits work well, and several reject a custom
# temperature, so sampling is left to the provider.
[[profile]]
name = "frontier"
match = ["claude", "gpt-5", "gemini"]
ctx = 128000
edit_format = "exact"
lenient_parsing = false

# Orchestrator: delegates to a read-only `plan` subagent, then hands that plan to
# a `build` subagent to carry out — paying only for each subagent's final summary,
# not its reads/edits/output. Select with --profile orchestrator. Point it at your
# strongest available model.
[[profile]]
name = "orchestrator"
ctx = 128000
edit_format = "exact"
subagents = ["plan", "build"]
require_check_pass = true
prompt_extra = "Work by delegating. First task the plan subagent to produce an implementation plan, then task the build subagent with that plan to carry it out. Keep your own context minimal."

# Read-only planner: no edit/write/bash, so it can only investigate and return a
# plan. Useful standalone (--profile plan) or as the orchestrator's plan role.
# Generous ctx (investigation spans many files; the parent only pays the summary).
[[profile]]
name = "plan"
ctx = 65536
tools = ["read", "grep", "glob"]

# Executor: carries out a plan with full tools. With a check configured (its own
# or one inherited from the run's TERN_CHECK), require_check_pass keeps it from
# finishing while that check fails. Paired with `plan` under the orchestrator.
[[profile]]
name = "build"
ctx = 65536
edit_format = "exact"
require_check_pass = true
prompt_extra = "You are given an implementation plan. Carry it out exactly, then verify."

[[profile]]
name = "qwen3-coder"
match = ["qwen3-coder"]
ctx = 65536
temperature = 0.7
top_p = 0.8
top_k = 20
repeat_penalty = 1.05
edit_format = "fuzzy"

# gpt-oss expects its reasoning to be passed back across tool calls within
# a request, so it's kept until the next user message.
[[profile]]
name = "gpt-oss"
match = ["gpt-oss"]
ctx = 65536
temperature = 1.0
top_p = 1.0
keep_reasoning = true
edit_format = "fuzzy"

# For 7B-14B models. Select explicitly with --profile small.
# Fewer tools, examples in descriptions, whole-file writes instead of
# find-and-replace, and a tighter context so the model stays focused.
[[profile]]
name = "small"
ctx = 16384
temperature = 0.2
edit_format = "whole"
tools = ["read", "write", "grep", "bash"]
prompt = "guided"
prompt_extra = "Work in small steps. Read a file before writing it. Make one change at a time."
